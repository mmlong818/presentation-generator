name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  visual-regression:
    runs-on: ubuntu-latest
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start dev server
        run: |
          PORT=3010 pnpm dev > .dev.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:3010/deck?fixture=cover > /dev/null && exit 0
            sleep 1
          done
          echo "dev server failed to start"; cat .dev.log; exit 1
      - name: Run visual regression
        env:
          PG_BASE_URL: http://localhost:3010
        # Override proxy: CI runner doesn't have a system proxy.
        run: |
          sed -i 's|proxy: { server:.*|proxy: undefined,|' scripts/expert-walkthrough.mjs
          node scripts/expert-walkthrough.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-screenshots
          path: .realcheck/expert/
          retention-days: 14
